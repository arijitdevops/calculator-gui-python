[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycalculator"
version = "1.0.0"
description = "A standalone desktop scientific calculator with a Tkinter interface and an eval-free expression engine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Common Labs" }]
keywords = ["calculator", "tkinter", "gui", "desktop", "parser", "shunting-yard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "pyinstaller>=6.3,<7",
    "ruff>=0.5,<1",
]

[project.gui-scripts]
pycalculator = "calculator.__main__:main"

[project.urls]
Homepage = "https://github.com/commonlabs/calculator-gui-python"
Issues = "https://github.com/commonlabs/calculator-gui-python/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
# D105/D107: dunder and __init__ docstrings are covered by the class docstring.
# D413: no blank line required after the last docstring section.
# UP006/UP035/UP045: keep typing.List/Optional spellings for Python 3.9 readers.
ignore = ["D105", "D107", "D203", "D213", "D413", "UP006", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
